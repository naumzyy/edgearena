services:
  - type: web
    name: pulsematch-landing
    runtime: static
    staticPublishPath: .
    buildCommand: echo "Static landing — no build required"
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
